<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin: 20px;
      color: #2c3e50;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .title {
      padding: 15px;
      font-size: 1.2em;
      font-weight: bold;
      background-color: #3498db;
      color: white;
      text-align: center;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }

    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .description {
      padding: 15px;
      font-size: 0.95em;
      background-color: #ecf0f1;
      color: #555;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 1em;
      }

      .description {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>

  <h1>Video Gallery</h1>
  <div class="container" id="videoContainer"></div>

  <script>
    async function fetchVideos() {
      try {
        const res = await fetch('http://localhost:8080/movie-info/lists');
        const videos = await res.json();
        const container = document.getElementById('videoContainer');

        videos.forEach(video => {
          const card = document.createElement('div');
          card.className = 'card';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = video.name;

          const videoContainer = document.createElement('div');
          videoContainer.className = 'video-container';

          const vid = document.createElement('video');
          vid.setAttribute('controls', true);
          vid.setAttribute('preload', 'metadata');
          vid.src = `http://localhost:8080/movie-stream/with-id/${video.id}`;

          // Show thumbnail from 2 seconds using loadedmetadata
          vid.addEventListener('loadedmetadata', () => {
            if (vid.duration > 2) {
              vid.currentTime = 2;
            }
          });

          const description = document.createElement('div');
          description.className = 'description';
          description.textContent = video.description;

          videoContainer.appendChild(vid);
          card.appendChild(title);
          card.appendChild(videoContainer);
          card.appendChild(description);
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching videos:', error);
      }
    }

    fetchVideos();
  </script>

</body>
</html>
